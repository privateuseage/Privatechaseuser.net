<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chase Bank Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #004481, #0073cf);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-container {
      text-align: center;
      color: #fff;
      animation: fadeIn 2s ease-in-out;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: rotate 4s linear infinite;
    }

    .logo img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    h1 {
      font-size: 1.8em;
      font-weight: 600;
      letter-spacing: 1px;
    }

    p {
      margin-top: 10px;
      font-size: 0.9em;
      opacity: 0.8;
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Loader dots */
    .loader {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="logo">
      <img src="1.png" alt="Chase Bank Logo" />
    </div>
    <h1>Welcome to Chase Bank</h1>
    <p>Banking made simple, secure & smart</p>
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    // Redirect to login page after splash delay
    setTimeout(() => {
      window.location.href = "login.html";
    }, 4000); // 4 seconds delay
  </script>
</body>
</html>
